# No explicit target list: rail analyzes the host target. Naming the two macOS
# targets made this check unrunnable anywhere else, because collecting compiler
# evidence for a target the host cannot build fails, and rail then reports
# unification edits that a macOS run never sees.

[unify]
detect_unused = true
remove_unused = false  # Report only; manual removal
prune_dead_features = true
msrv = true
msrv_source = "max"
pin_transitives = false

[change-detection]
infrastructure = [
    ".github/**",
    "Cargo.lock",
    "rust-toolchain.toml",
    "xtask/**",
]

[change-detection.custom]
frontend = ["crates/frontend/src/**", "crates/frontend/package.json"]
